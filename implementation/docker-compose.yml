name: rekordly-v2

services:
  rekordly-postgres:
    image: postgres:16-alpine
    container_name: rekordly-postgres
    env_file: ./infra/.env.local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rekordly-net

  rekordly-mailpit:
    image: axllent/mailpit:v1.27
    container_name: rekordly-mailpit
    ports:
      - "8025:8025"
    networks:
      - rekordly-net

  rekordly-migrate:
    build: ./api
    container_name: rekordly-migrate
    entrypoint: ["/rekordly-migrate"]
    env_file: ./api/.env.local
    depends_on:
      rekordly-postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - rekordly-net

  rekordly-api:
    build: ./api
    container_name: rekordly-api
    env_file: ./api/.env.local
    ports:
      - "8080:8080"
    depends_on:
      rekordly-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/rekordly-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - rekordly-net

  rekordly-worker:
    build: ./worker
    container_name: rekordly-worker
    env_file: ./worker/.env.local
    depends_on:
      rekordly-migrate:
        condition: service_completed_successfully
      rekordly-mailpit:
        condition: service_started
    networks:
      - rekordly-net

  rekordly-web:
    build: ./web
    container_name: rekordly-web
    env_file: ./web/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - rekordly-api
    networks:
      - rekordly-net

volumes:
  pgdata:

networks:
  rekordly-net:
    driver: bridge
